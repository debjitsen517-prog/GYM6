<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>For Shreya 💗</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#583c5d;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.75),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(255,255,255,.45),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #ffd8eb,
            #e8d9ff,
            #f8dced
        );
}


/* =========================
   FLOATING HEARTS
========================= */

.hearts{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:1;
}

.heart{

    position:absolute;

    font-size:25px;

    opacity:.65;

    animation:
        heartFloat
        7s
        ease-in-out
        infinite;
}

.heart:nth-child(1){
    left:5%;
    top:15%;
}

.heart:nth-child(2){
    left:17%;
    top:70%;
    animation-delay:1s;
}

.heart:nth-child(3){
    left:30%;
    top:10%;
    animation-delay:2s;
}

.heart:nth-child(4){
    left:48%;
    top:82%;
    animation-delay:3s;
}

.heart:nth-child(5){
    left:65%;
    top:14%;
    animation-delay:1.5s;
}

.heart:nth-child(6){
    left:78%;
    top:68%;
    animation-delay:4s;
}

.heart:nth-child(7){
    left:91%;
    top:25%;
    animation-delay:2.5s;
}

.heart:nth-child(8){
    left:55%;
    top:35%;
    animation-delay:5s;
}

@keyframes heartFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-25px)
            rotate(10deg);
    }
}


/* =========================
   COMMON PAGE
========================= */

.page{

    min-height:100vh;

    width:100%;

    position:relative;

    z-index:5;
}

.hidden{
    display:none !important;
}


/* =========================
   LOGIN PAGE
========================= */

#loginPage{

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.login-card{

    width:min(92%,520px);

    padding:45px 28px;

    text-align:center;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius:40px;

    box-shadow:
        0 25px 70px
        rgba(100,50,120,.20);

    animation:
        cardIn
        .8s
        ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            scale(.85)
            translateY(20px);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
    }
}


/* LOCK */

.lock{

    font-size:65px;

    margin-bottom:25px;

    animation:
        lockFloat
        2s
        ease-in-out
        infinite;
}

@keyframes lockFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}


/* PASSWORD */

.password{

    width:100%;

    padding:18px 20px;

    border:
        3px solid
        #e5c9e5;

    border-radius:25px;

    outline:none;

    background:#fffaff;

    text-align:center;

    font-size:19px;

    color:#633e65;

    transition:.2s;
}

.password:focus{

    border-color:#bd4daf;

    box-shadow:
        0 0 20px
        rgba(189,77,175,.20);
}


/* ENTER BUTTON */

.enter-btn{

    margin-top:24px;

    padding:
        17px
        58px;

    border:0;

    border-radius:50px;

    color:white;

    font-size:21px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #d944a5,
            #8d4ed8
        );

    box-shadow:
        0 12px 30px
        rgba(145,65,165,.25);

    cursor:pointer;

    transition:.2s;
}

.enter-btn:active{
    transform:scale(.94);
}

.error{

    min-height:22px;

    margin-top:13px;

    color:#d53e6d;

    font-size:15px;
}


/* =========================
   QUESTION PAGE
========================= */

#questionPage{

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.question-card{

    width:min(94%,650px);

    min-height:500px;

    padding:45px 25px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(15px);

    border-radius:40px;

    box-shadow:
        0 25px 70px
        rgba(100,50,120,.20);

    animation:
        questionIn
        .8s
        ease;
}

@keyframes questionIn{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.9);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* QUESTION HEART */

.question-heart{

    font-size:75px;

    margin-bottom:18px;

    animation:
        heartBeat
        1.2s
        infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }
}


/* QUESTION */

.question-title{

    font-size:
        clamp(
            30px,
            7vw,
            52px
        );

    line-height:1.25;

    font-weight:900;

    color:#a3429c;

    margin-bottom:15px;
}

.question-subtitle{

    font-size:19px;

    color:#765c74;

    margin-bottom:25px;
}


/* =========================
   BUTTON AREA
========================= */

.button-area{

    position:relative;

    width:100%;

    height:115px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;
}


/* YES */

.yes-btn{

    padding:
        16px
        45px;

    border:0;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #d944a5,
            #8d4ed8
        );

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(145,65,165,.25);

    transition:.2s;

    z-index:10;
}

.yes-btn:hover{

    transform:
        scale(1.06);
}


/* NO */

.no-btn{

    padding:
        16px
        42px;

    border:0;

    border-radius:50px;

    background:#eee3f0;

    color:#795879;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(
            45px,
            -50%
        );

    transition:
        left .15s ease,
        top .15s ease,
        transform .15s ease;

    z-index:20;
}


/* =========================
   ERROR MESSAGE
========================= */

.no-error{

    width:100%;

    min-height:75px;

    margin-top:10px;

    padding:16px 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#d13c71;

    font-size:
        clamp(
            19px,
            4.5vw,
            27px
        );

    font-weight:900;

    line-height:1.35;

    border-radius:22px;

    background:
        rgba(255,225,240,.75);

    border:
        2px solid
        rgba(209,60,113,.15);

    box-shadow:
        0 10px 25px
        rgba(180,70,120,.10);

    animation:
        errorPop
        .25s
        ease;

    z-index:8;

    position:relative;
}

@keyframes errorPop{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
   WELCOME PAGE
========================= */

#welcomePage{

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.welcome-card{

    width:min(94%,700px);

    padding:
        55px
        25px;

    text-align:center;

    background:
        rgba(255,255,255,.95);

    backdrop-filter:
        blur(15px);

    border-radius:42px;

    box-shadow:
        0 25px 75px
        rgba(100,50,120,.22);

    animation:
        welcomeIn
        .8s
        ease;
}

@keyframes welcomeIn{

    from{
        opacity:0;
        transform:
            scale(.5)
            rotate(-3deg);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            rotate(0);
    }
}

.welcome-heart{

    font-size:85px;

    animation:
        heartBeat
        1s
        infinite;
}

.welcome-title{

    margin-top:20px;

    font-size:
        clamp(
            32px,
            8vw,
            58px
        );

    line-height:1.25;

    font-weight:900;

    color:#a3429c;
}

.welcome-text{

    margin-top:20px;

    font-size:20px;

    line-height:1.6;

    color:#674d65;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .login-card{
        padding:40px 20px;
        border-radius:32px;
    }

    .question-card{
        min-height:500px;
        padding:40px 20px;
        border-radius:32px;
    }

    .question-title{
        font-size:34px;
    }

    .question-subtitle{
        font-size:17px;
    }

    .button-area{
        height:125px;
    }

    .yes-btn{
        padding:
            15px
            38px;
    }

    .no-btn{
        padding:
            15px
            35px;
    }

    .no-error{

        min-height:85px;

        font-size:20px;

        padding:
            15px
            12px;
    }

    .welcome-card{
        padding:45px 20px;
        border-radius:32px;
    }

    .welcome-title{
        font-size:36px;
    }

    .welcome-text{
        font-size:18px;
    }

}

</style>

</head>


<body>


<!-- =========================
     FLOATING HEARTS
========================= -->

<div class="hearts">

    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💖</div>
    <div class="heart">💘</div>
    <div class="heart">💞</div>
    <div class="heart">💓</div>
    <div class="heart">💝</div>
    <div class="heart">💗</div>

</div>


<!-- =========================
     LOGIN PAGE
========================= -->

<section
    id="loginPage"
    class="page"
>

    <div class="login-card">

        <div class="lock">
            🔑
        </div>

        <input
            id="passwordInput"
            class="password"
            type="password"
            placeholder="Enter Password 🔐"
            autocomplete="off"
        >

        <button
            class="enter-btn"
            onclick="login()"
        >
            Enter ❤️
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</section>


<!-- =========================
     QUESTION PAGE
========================= -->

<section
    id="questionPage"
    class="page hidden"
>

    <div class="question-card">

        <div class="question-heart">
            💗
        </div>

        <div class="question-title">

            Heyyy Shreyaa... 🥹<br>

            Will you be my girlfriend??

        </div>

        <div class="question-subtitle">

            Think carefully... 😌💕

        </div>


        <div class="button-area">

            <button
                id="yesBtn"
                class="yes-btn"
                onclick="sayYes()"
            >
                Yes ❤️
            </button>


            <button
                id="noBtn"
                class="no-btn"
                onclick="moveNo()"
                ontouchstart="moveNo(event)"
            >
                No 😝
            </button>

        </div>


        <!-- ERROR AREA -->

        <div
            id="noError"
            class="no-error"
        ></div>

    </div>

</section>


<!-- =========================
     WELCOME PAGE
========================= -->

<section
    id="welcomePage"
    class="page hidden"
>

    <div class="welcome-card">

        <div class="welcome-heart">
            🥹💗
        </div>

        <div class="welcome-title">

            Welcome to my life<br>

            as a best friend,<br>

            Shreya 🥹💕

        </div>

        <div class="welcome-text">

            Well... you clicked YES 😌❤️<br>

            So I guess you're officially
            stuck with Debjit now! 🤭

        </div>

    </div>

</section>


<!-- =========================
     BACKGROUND MUSIC
========================= -->

<audio
    id="bgMusic"
    preload="auto"
    loop
>

    <source
        src="https://res.cloudinary.com/s4rjpsff/video/upload/v1788366842/Ishq_wala_love_instrumental_256k__1_1.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

/* =========================
   SETTINGS
========================= */

const PASSWORD = "DONT BE SERIOUS";

const MUSIC_VOLUME = 0.90;


/* =========================
   ERROR MESSAGES
========================= */

const errorMessages = [

    "এরকম করতে পারলি তো 🥺",

    "মনে রাখবি,,,যেটা করছিস",

    "কথা বলিস না",

    "ভাই এরকম কেন করছিস 🥺😡",

    "ভাই করিস না plss,,,",

    "তোর বাচ্চা হবে নাই গাঁন্দু",

    "আবে লেওড়া গাল শুনবি কি ?? 😡😡"

];

let errorIndex = 0;


/* =========================
   ELEMENTS
========================= */

const loginPage =
    document.getElementById(
        "loginPage"
    );

const questionPage =
    document.getElementById(
        "questionPage"
    );

const welcomePage =
    document.getElementById(
        "welcomePage"
    );

const passwordInput =
    document.getElementById(
        "passwordInput"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const bgMusic =
    document.getElementById(
        "bgMusic"
    );

const noBtn =
    document.getElementById(
        "noBtn"
    );

const noError =
    document.getElementById(
        "noError"
    );


/* =========================
   LOGIN
========================= */

function login(){

    const password =
        passwordInput.value.trim();


    if(
        password !== PASSWORD
    ){

        loginError.textContent =
            "Wrong password 😝 Try again!";

        passwordInput.value = "";

        passwordInput.focus();

        return;
    }


    loginError.textContent = "";


    /* MUSIC */

    bgMusic.volume =
        MUSIC_VOLUME;

    bgMusic.currentTime = 0;


    const musicPromise =
        bgMusic.play();


    if(
        musicPromise !== undefined
    ){

        musicPromise.catch(
            function(){

                console.log(
                    "Music playback waiting..."
                );

            }
        );

    }


    loginPage.classList.add(
        "hidden"
    );

    questionPage.classList.remove(
        "hidden"
    );

}


/* =========================
   ENTER KEY
========================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);


/* =========================
   NO BUTTON
========================= */

function moveNo(event){

    if(event){

        event.preventDefault();

    }


    /* =========================
       SHOW NEXT ERROR
    ========================= */

    noError.textContent =
        errorMessages[errorIndex];


    errorIndex++;

    /* Repeat from first message */

    if(
        errorIndex >= errorMessages.length
    ){

        errorIndex = 0;

    }


    /* Restart animation */

    noError.style.animation =
        "none";

    void noError.offsetWidth;

    noError.style.animation =
        "errorPop .25s ease";


    /* =========================
       GET CARD POSITION
    ========================= */

    const card =
        document.querySelector(
            ".question-card"
        );

    const buttonArea =
        document.querySelector(
            ".button-area"
        );

    const areaRect =
        buttonArea.getBoundingClientRect();

    const btnRect =
        noBtn.getBoundingClientRect();


    /* =========================
       RANDOM POSITION
       ONLY INSIDE BUTTON AREA
    ========================= */

    const maxX =
        areaRect.width -
        btnRect.width -
        10;

    const maxY =
        areaRect.height -
        btnRect.height -
        10;


    const randomX =
        Math.max(
            5,
            Math.random() * maxX
        );


    const randomY =
        Math.max(
            5,
            Math.random() * maxY
        );


    /* =========================
       MOVE NO BUTTON
    ========================= */

    noBtn.style.position =
        "absolute";

    noBtn.style.left =
        randomX + "px";

    noBtn.style.top =
        randomY + "px";

    noBtn.style.transform =
        "none";

}


/* =========================
   MOUSE PROTECTION
========================= */

noBtn.addEventListener(
    "mouseenter",
    function(){

        moveNo();

    }
);


/* =========================
   TOUCH PROTECTION
========================= */

noBtn.addEventListener(
    "touchstart",
    function(event){

        moveNo(event);

    },
    {
        passive:false
    }
);


/* =========================
   YES BUTTON
========================= */

function sayYes(){

    bgMusic.volume =
        MUSIC_VOLUME;


    if(
        bgMusic.paused
    ){

        bgMusic.play().catch(
            function(){}
        );

    }


    questionPage.classList.add(
        "hidden"
    );

    welcomePage.classList.remove(
        "hidden"
    );

}


/* =========================
   INITIAL MUSIC
========================= */

bgMusic.volume =
    MUSIC_VOLUME;

</script>

</body>
</html>
