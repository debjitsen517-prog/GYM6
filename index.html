<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Bokachodas 💜</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
    color:#4b3560;

    background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.85),transparent 27%),
    radial-gradient(circle at 90% 85%,rgba(205,170,255,.4),transparent 32%),
    linear-gradient(135deg,#eadcff,#f8efff,#d9c3ff);
}


/* ================= FLOATING HEARTS ================= */

.hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.heart{
    position:absolute;
    font-size:25px;
    opacity:.55;
    animation:heartFloat 7s ease-in-out infinite;
}

.heart:nth-child(1){left:5%;top:18%;animation-delay:0s}
.heart:nth-child(2){left:17%;top:70%;animation-delay:1s}
.heart:nth-child(3){left:30%;top:12%;animation-delay:2s}
.heart:nth-child(4){left:48%;top:82%;animation-delay:3s}
.heart:nth-child(5){left:66%;top:15%;animation-delay:1.5s}
.heart:nth-child(6){left:80%;top:68%;animation-delay:4s}
.heart:nth-child(7){left:92%;top:25%;animation-delay:2.5s}
.heart:nth-child(8){left:55%;top:38%;animation-delay:5s}

@keyframes heartFloat{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-25px) rotate(10deg);
    }
}


/* ================= COMMON ================= */

.page{
    min-height:100vh;
    width:100%;
    position:relative;
    z-index:2;
}

.hidden{
    display:none !important;
}


/* ================= LOGIN ================= */

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:min(92%,500px);
    padding:45px 25px;
    text-align:center;

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.8);

    border-radius:38px;

    box-shadow:
        0 25px 70px rgba(82,45,120,.22);
}

.lock{
    font-size:60px;
    margin-bottom:22px;

    animation:
        lockFloat
        2s
        ease-in-out
        infinite;
}

@keyframes lockFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.login-title{
    color:#70409c;
    font-size:27px;
    font-weight:bold;
    margin-bottom:25px;
}

.password{
    width:100%;
    padding:17px 20px;

    border:2px solid #c9afe7;

    border-radius:25px;

    background:#fcf9ff;

    outline:none;

    text-align:center;

    font-size:18px;

    color:#563671;
}

.password:focus{
    border-color:#8d4dc4;

    box-shadow:
        0 0 18px rgba(141,77,196,.2);
}

.enter-btn{
    margin-top:23px;

    padding:16px 55px;

    border:0;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #8145bd,
            #b45be0
        );

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 30px rgba(104,57,151,.28);

    transition:.2s;
}

.enter-btn:active{
    transform:scale(.95);
}

.error{
    min-height:22px;
    margin-top:13px;
    color:#d04d77;
    font-size:15px;
}


/* ================= MAIN PAGE ================= */

#mainPage{
    padding:25px 12px 60px;
}

.main-card{
    width:min(94%,700px);

    margin:auto;

    padding:20px 25px 38px;

    text-align:center;

    background:rgba(255,255,255,.94);

    border-radius:38px;

    box-shadow:
        0 25px 70px rgba(79,43,117,.20);

    animation:
        cardIn
        .8s
        ease;
}

@keyframes cardIn{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ================= PHOTO ================= */

.photo-wrapper{
    width:100%;
    overflow:hidden;
    border-radius:28px;
    margin-bottom:16px;

    box-shadow:
        0 15px 40px rgba(70,39,100,.22);
}

.photo-wrapper img{
    width:100%;
    height:auto;
    display:block;
}


/* ================= THANKS ================= */

.thanks-text{

    font-size:
        clamp(
            30px,
            7vw,
            48px
        );

    line-height:1.12;

    font-weight:900;

    color:#5b3b7c;

    margin-bottom:2px;
}

.thanks-heart{
    font-size:38px;
    margin-bottom:0;
}


/* ================= QUESTION ================= */

.question{

    font-size:
        clamp(
            31px,
            7vw,
            48px
        );

    line-height:1.12;

    font-weight:900;

    color:#70409d;

    margin-top:7px;

    margin-bottom:7px;
}


/* ================= FUNNY MESSAGE ================= */

.funny-message{

    min-height:62px;

    width:100%;

    padding:0 5px;

    margin:0 auto 5px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    font-size:19px;

    line-height:1.35;

    font-weight:bold;

    color:#bd416d;

    animation:
        messagePop
        .25s
        ease;
}

@keyframes messagePop{

    from{
        opacity:0;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* ================= BUTTON AREA ================= */

.options-area{

    position:relative;

    width:100%;

    height:165px;

    margin-top:0;

    overflow:visible;
}


/* ================= BUTTONS ================= */

.option-btn{

    position:absolute;

    border:0;

    border-radius:50px;

    padding:15px 38px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    transition:
        left .18s ease,
        top .18s ease,
        transform .18s ease;
}


/* YES */

.yes-btn{

    left:50%;

    top:12px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            135deg,
            #8145bd,
            #b55ce1
        );

    color:white;

    box-shadow:
        0 10px 25px rgba(104,57,151,.28);
}

.yes-btn:active{

    transform:
        translateX(-50%)
        scale(.94);
}


/* NO */

.no-btn{

    left:50%;

    top:78px;

    transform:translateX(-50%);

    background:#f0e7f9;

    color:#67497a;

    box-shadow:
        0 8px 22px rgba(70,45,90,.15);
}


/* ================= FINAL PAGE ================= */

#finalPage{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px;

    text-align:center;
}

.final-card{

    width:min(94%,650px);

    padding:55px 25px;

    background:rgba(255,255,255,.94);

    border-radius:40px;

    box-shadow:
        0 25px 70px rgba(78,43,115,.22);

    animation:
        finalIn
        .8s
        ease;
}

@keyframes finalIn{

    from{
        opacity:0;
        transform:scale(.75);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.final-emoji{

    font-size:72px;

    margin-bottom:20px;
}

.final-title{

    font-size:
        clamp(
            31px,
            7vw,
            50px
        );

    line-height:1.25;

    font-weight:900;

    color:#70409d;
}

.final-subtitle{

    margin-top:22px;

    font-size:20px;

    line-height:1.6;

    color:#60456f;
}


/* ================= CONFETTI ================= */

.confetti{

    position:fixed;

    top:-30px;

    z-index:100;

    pointer-events:none;

    animation:
        confettiFall
        linear
        forwards;
}

@keyframes confettiFall{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .login-card{

        padding:40px 20px;

        border-radius:32px;
    }

    .main-card{

        padding:
            16px
            17px
            30px;

        border-radius:30px;
    }

    .photo-wrapper{

        border-radius:22px;

        margin-bottom:13px;
    }

    .thanks-text{

        font-size:32px;

        margin-bottom:0;
    }

    .thanks-heart{

        font-size:34px;
    }

    .question{

        font-size:33px;

        margin-top:4px;

        margin-bottom:5px;
    }

    .funny-message{

        font-size:17px;

        min-height:58px;

        padding:0 2px;
    }

    .options-area{

        height:165px;
    }

    .option-btn{

        font-size:18px;

        padding:
            14px
            32px;
    }

    .final-card{

        padding:
            45px
            20px;
    }

    .final-emoji{

        font-size:62px;
    }
}


/* ================= VERY SMALL PHONES ================= */

@media(max-width:380px){

    .thanks-text{
        font-size:29px;
    }

    .question{
        font-size:30px;
    }

    .funny-message{
        font-size:16px;
    }
}

</style>

</head>


<body>


<!-- ================= FLOATING HEARTS ================= -->

<div class="hearts">

    <div class="heart">💜</div>
    <div class="heart">💗</div>
    <div class="heart">💜</div>
    <div class="heart">💖</div>
    <div class="heart">💕</div>
    <div class="heart">💜</div>
    <div class="heart">💞</div>
    <div class="heart">💗</div>

</div>


<!-- ================= LOGIN ================= -->

<section
    id="loginPage"
    class="page"
>

    <div class="login-card">

        <div class="lock">
            🔐
        </div>

        <div class="login-title">
            A little surprise for you 💜
        </div>

        <input
            id="passwordInput"
            class="password"
            type="password"
            placeholder="Enter Password 🔑"
            autocomplete="off"
        >

        <button
            class="enter-btn"
            onclick="login()"
        >
            Enter ❤️
        </button>

        <div
            id="error"
            class="error"
        ></div>

    </div>

</section>


<!-- ================= MAIN PAGE ================= -->

<section
    id="mainPage"
    class="page hidden"
>

    <div class="main-card">


        <!-- PHOTO -->

        <div class="photo-wrapper">

            <img
                src="https://res.cloudinary.com/s4rjpsff/image/upload/v1788362804/IMG-20260812-WA0074.jpg"
                alt="Our Memory 💜"
            >

        </div>


        <!-- THANKS -->

        <div class="thanks-text">

            Thanks guyss for
            coming into my life 🥹

        </div>

        <div class="thanks-heart">
            🫶🏻
        </div>


        <!-- QUESTION -->

        <div class="question">

            Can I be your best
            friend? 🥹

        </div>


        <!-- FUNNY ERROR -->

        <div
            id="funnyMessage"
            class="funny-message"
        ></div>


        <!-- OPTIONS -->

        <div class="options-area">

            <button
                id="yesBtn"
                class="option-btn yes-btn"
                onclick="sayYes()"
            >
                YES 💜
            </button>


            <button
                id="noBtn"
                class="option-btn no-btn"
                onclick="runAway()"
            >
                NO 😭
            </button>

        </div>

    </div>

</section>


<!-- ================= FINAL PAGE ================= -->

<section
    id="finalPage"
    class="page hidden"
>

    <div class="final-card">

        <div class="final-emoji">
            🥹🫶🏻💜
        </div>

        <div class="final-title">

            Then also welcome to my life
            as a best frndss,
            bokachodass 🥹🫶🏻

        </div>

        <div class="final-subtitle">

            Finally you chose the correct option! 😂💜

            <br><br>

            Now no escape from your
            God friend Debjit 😌🤝

        </div>

    </div>

</section>


<!-- ================= BACKGROUND MUSIC ================= -->

<audio
    id="bgMusic"
    preload="auto"
    loop
>

    <source
        src="https://res.cloudinary.com/s4rjpsff/video/upload/v1788362135/Pehla_Nasha__-_Instrumental___Pehla_Nasha___Pehla_Nasha_-_Piano_256k__1.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

/* ================= SETTINGS ================= */

const PASSWORD = "CHABLAMI";

const MUSIC_VOLUME = 0.90;


/* ================= ELEMENTS ================= */

const loginPage =
    document.getElementById("loginPage");

const mainPage =
    document.getElementById("mainPage");

const finalPage =
    document.getElementById("finalPage");

const passwordInput =
    document.getElementById("passwordInput");

const error =
    document.getElementById("error");

const bgMusic =
    document.getElementById("bgMusic");

const noBtn =
    document.getElementById("noBtn");

const funnyMessage =
    document.getElementById("funnyMessage");


/* ================= LOGIN ================= */

function login(){

    const password =
        passwordInput.value.trim();


    if(password !== PASSWORD){

        error.textContent =
            "Wrong password 😝 Try again!";

        passwordInput.value = "";

        passwordInput.focus();

        return;
    }


    error.textContent = "";


    /* START MUSIC */

    bgMusic.volume =
        MUSIC_VOLUME;

    bgMusic.play().catch(function(){

        console.log(
            "Music playback waiting..."
        );

    });


    /* CHANGE PAGE */

    loginPage.classList.add("hidden");

    mainPage.classList.remove("hidden");

}


/* ================= ENTER KEY ================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* ================= NO BUTTON ================= */

let noCount = 0;


function runAway(){

    noCount++;


    const messages = [

        "Hey bokachoda 😭 Choose another option for your God friend Debjit 🤨",

        "Your answer doesn't supported here 😂 Please choose another one for your God friend Debjit 🫡",

        "Abar NO?! 😭 Choose another option bokachoda 😂",

        "ERROR 404: NO answer not supported 🤣💜",

        "NO button is scared of you 😭 Try YES instead! 😂",

        "Hey bokachoda 😭 Ei option ta tor jonno na! Choose another one 🤨💜",

        "Please stop clicking NO 😭 Your God friend Debjit has rejected this answer 😂"

    ];


    funnyMessage.textContent =
        messages[
            (noCount - 1) %
            messages.length
        ];


    const area =
        document.querySelector(
            ".options-area"
        );


    const areaWidth =
        area.clientWidth;

    const areaHeight =
        area.clientHeight;

    const buttonWidth =
        noBtn.offsetWidth;

    const buttonHeight =
        noBtn.offsetHeight;


    const maxX =
        Math.max(
            0,
            areaWidth - buttonWidth
        );

    const maxY =
        Math.max(
            0,
            areaHeight - buttonHeight
        );


    const randomX =
        Math.floor(
            Math.random() * maxX
        );

    const randomY =
        Math.floor(
            Math.random() * maxY
        );


    noBtn.style.left =
        randomX + "px";

    noBtn.style.top =
        randomY + "px";

    noBtn.style.transform =
        "none";


    noBtn.animate(

        [

            {
                transform:
                    "scale(.75) rotate(-10deg)"
            },

            {
                transform:
                    "scale(1.12) rotate(10deg)"
            },

            {
                transform:
                    "scale(1) rotate(0deg)"
            }

        ],

        {
            duration:300,
            easing:"ease-out"
        }

    );

}


/* ================= YES ================= */

function sayYes(){

    mainPage.classList.add("hidden");

    finalPage.classList.remove("hidden");

    createConfetti();

}


/* ================= CONFETTI ================= */

function createConfetti(){

    const symbols = [

        "💜",
        "💗",
        "💖",
        "✨",
        "💕",
        "🫶🏻"

    ];


    for(
        let i = 0;
        i < 40;
        i++
    ){

        const piece =
            document.createElement("div");


        piece.className =
            "confetti";


        piece.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        piece.style.left =
            Math.random() * 100 + "vw";


        piece.style.fontSize =
            (
                15 +
                Math.random() * 18
            ) + "px";


        piece.style.animationDuration =
            (
                3 +
                Math.random() * 4
            ) + "s";


        piece.style.animationDelay =
            Math.random() * 1.2 + "s";


        document.body.appendChild(
            piece
        );


        setTimeout(

            function(){

                piece.remove();

            },

            7500

        );

    }

}

</script>

</body>
</html>
